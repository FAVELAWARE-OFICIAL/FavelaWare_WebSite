<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material, FavelaWare</title>
  <meta name="description" content="Materiais do curso FavelaWare.">

  <link rel="icon" type="image/png" href="imgs/logo/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/material.css">

  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <site-navbar current="material"></site-navbar>

  <header class="page-header">
    <div class="container">
      <h1 class="page-header__title">MATERIAIS</h1>
      <p class="page-header__subtitle">Acesse os materiais do curso</p>
    </div>
  </header>

  <main>
    <section class="materials" data-aos="fade-up">
      <div class="materials__inner">
        <h2 class="materials__title">📚 Materiais Disponíveis</h2>

        <div class="materials__grid">
          <a class="material-card" href="https://drive.google.com/drive/folders/1S4jR80qAN6IAeQv-HlzOxzyv1_-FA4hs?usp=sharing" target="_blank" rel="noopener">
            <span class="material-card__icon" aria-hidden="true">📁</span>
            <div>
              <h3 class="material-card__title">FavelaWare - 3ª Edição</h3>
              <p class="material-card__desc">Materiais completos da terceira edição do curso</p>
              <div class="material-card__meta">
                <span class="material-card__platform material-card__platform--drive">Google Drive</span>
                <span class="material-card__more">Acessar →</span>
              </div>
            </div>
          </a>

          <a class="material-card" href="https://favelaware.gitbook.io/favelaware/" target="_blank" rel="noopener">
            <span class="material-card__icon" aria-hidden="true">📚</span>
            <div>
              <h3 class="material-card__title">FavelaWare GitBook</h3>
              <p class="material-card__desc">Documentação técnica e tutoriais interativos</p>
              <div class="material-card__meta">
                <span class="material-card__platform material-card__platform--gitbook">GitBook</span>
                <span class="material-card__more">Acessar →</span>
              </div>
            </div>
          </a>
        </div>
      </div>
    </section>
  </main>

  <site-footer></site-footer>
</body>
</html>
